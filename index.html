<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BABA AI GENERATOR VIDEO PRO V8</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f1ea;color:#202020}
.app{max-width:1100px;margin:auto;padding:18px}
header{background:#171717;color:#fff;border-radius:22px;padding:22px;margin-bottom:16px}
header h1{margin:0 0 6px;font-size:25px}
header p{margin:0;color:#cfcfcf}
.panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 6px 24px #0000000d}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;border:1px solid #d8d8d8;border-radius:12px;padding:12px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}
.primary{background:#171717;color:#fff}.secondary{background:#ece8df;color:#171717}
.danger{background:#b42318;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.status{padding:12px;border-radius:12px;background:#f1f1f1;margin-top:12px;font-size:13px}
#scenesList{display:grid;gap:14px}
.scene{border:1px solid #dedede;border-radius:18px;padding:14px;background:#fff}
.scene-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.scene h3{margin:0;font-size:17px}
.badge{font-size:11px;background:#eee;padding:5px 8px;border-radius:999px}
.scene-grid{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-top:12px}
.scene img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#eee;display:block}
.scene-meta p{margin:8px 0;font-size:13px;line-height:1.45}
.scene-meta b{display:block;margin-bottom:3px}
.scene-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.scene textarea{min-height:70px}
.social-footer{position:static!important;display:block!important;clear:both!important;grid-column:1/-1!important;width:100%!important;margin:18px 0 0!important;padding:16px!important;background:#171717!important;color:#fff!important;border-radius:18px!important}
.social-footer .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.social-footer a{color:#fff;text-decoration:none;background:#2a2a2a;padding:8px 10px;border-radius:9px;font-size:12px}
.small{font-size:12px;color:#666}
.hidden{display:none!important}
@media(max-width:720px){
 .row{grid-template-columns:1fr}
 .scene-grid{grid-template-columns:1fr}
 .scene img{max-height:520px}
 .app{padding:10px}
 header{border-radius:16px}
}
</style>
</head>
<body>
<main class="app">
<header>
  <h1>🎬 BABA AI GENERATOR VIDEO PRO — V8</h1>
  <p>Real scene images • character consistency • MP4 slideshow • mobile friendly</p>
</header>

<section class="panel">
  <label for="topic">VIDEO IDEA</label>
  <textarea id="topic" placeholder="Contoh: Kucing naik pohon"></textarea>

  <div class="row">
    <div>
      <label for="sceneCount">Jumlah Scene</label>
      <select id="sceneCount">
        <option>5</option><option selected>10</option><option>12</option><option>15</option>
      </select>
    </div>
    <div>
      <label for="duration">Durasi per Scene</label>
      <select id="duration">
        <option value="2">2 detik</option>
        <option value="3" selected>3 detik</option>
        <option value="4">4 detik</option>
        <option value="5">5 detik</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label for="style">Visual Style</label>
      <select id="style">
        <option>cinematic realistic</option>
        <option>3D animated film</option>
        <option>cute cartoon</option>
        <option>watercolor storybook</option>
        <option>vintage illustration</option>
      </select>
    </div>
    <div>
      <label for="apiBase">AI Backend URL</label>
      <input id="apiBase" placeholder="https://your-worker.example.workers.dev">
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="generate">✨ GENERATE STORY</button>
    <button class="secondary" id="generateAll">🖼️ GENERATE ALL REAL IMAGES</button>
    <button class="primary" id="createMp4">🎞️ CREATE MP4</button>
    <button class="secondary" id="clearAll">RESET</button>
  </div>
  <div class="status" id="status">Ready. Masukkan ide video.</div>
  <p class="small">API key tidak disimpan di halaman ini. Backend Worker yang memegang secret key.</p>
</section>

<section class="panel">
  <h2 style="margin-top:0">SCENES</h2>
  <div id="scenesList"></div>
</section>

<footer class="social-footer">
  <strong>BABA AI GENERATOR VIDEO PRO</strong>
  <div class="links">
    <a href="#" onclick="return false">Facebook</a>
    <a href="#" onclick="return false">Instagram</a>
    <a href="#" onclick="return false">TikTok</a>
    <a href="#" onclick="return false">LYNK.ID</a>
  </div>
</footer>
</main>

<script type="module" src="app.js?v=8"></script>
</body>
</html>
